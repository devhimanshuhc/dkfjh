name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: codebuild-org-gha-runner-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # Full history so gitleaks can walk the commit range.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          cache: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: pnpm install

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level critical

      - name: Scan for secrets (gitleaks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # An all-zero "before" only happens on the push that creates main (feature
          # branches arrive as PRs with a real base). Scan HEAD alone there: repos made
          # from this template start as one squashed commit, and a full-history scan
          # would fail on this template's own past findings.
          if [ -z "${BASE_SHA//0/}" ]; then RANGE="-1 ${HEAD_SHA}"; else RANGE="${BASE_SHA}..${HEAD_SHA}"; fi
          pnpm gitleaks git --redact --verbose --log-opts="${RANGE}" .

      - name: Run linting
        run: pnpm db:generate

      - name: Run Package
        run: pnpm package

      - name: Check formatting
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: React Doctor
        uses: millionco/react-doctor@v2
        env:
          # Parallel lint workers each reserve an 8 GB heap, which exceeds the
          # runner's 7.5 GB cgroup and makes the scan die with spawn ENOMEM.
          REACT_DOCTOR_PARALLEL: "1"
        with:
          project: "web,@repo/ui"

      - name: Run tests
        run: pnpm test
